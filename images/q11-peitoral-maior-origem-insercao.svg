<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="muscleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="40%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fundo com Borda Elegante -->
  <rect width="700" height="460" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="698" height="458" rx="15" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Grid sutil de fundo para estética técnica -->
  <g stroke="rgba(255,255,255,0.025)" stroke-width="1">
    <line x1="0" y1="90" x2="700" y2="90"/>
    <line x1="0" y1="180" x2="700" y2="180"/>
    <line x1="0" y1="270" x2="700" y2="270"/>
    <line x1="0" y1="360" x2="700" y2="360"/>
    <line x1="175" y1="0" x2="175" y2="380"/>
    <line x1="350" y1="0" x2="350" y2="380"/>
    <line x1="525" y1="0" x2="525" y2="380"/>
  </g>

  <!-- Cabeçalho do Card -->
  <g transform="translate(24, 20)">
    <!-- Badge da Categoria -->
    <rect x="0" y="0" width="103.5" height="24" rx="12" fill="rgba(202, 138, 4, 0.2)" stroke="rgba(234, 179, 8, 0.4)" stroke-width="1"/>
    <text x="51.75" y="16" fill="#facc15" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="1" text-anchor="middle">6. PEITORAL</text>
    
    <!-- Título Principal -->
    <text x="0" y="44" fill="#f8fafc" font-family="'Inter', system-ui, sans-serif" font-size="19" font-weight="800" letter-spacing="-0.3">Músculo Peitoral Maior: Porções Clavicular e Esternocostal</text>
    <text x="0" y="62" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="500">Origem ampla anterior convergindo para a crista do tubérculo maior</text>
  </g>

  <!-- Conteúdo Ilustrativo Central -->
  <g transform="translate(0, 75)">
    
    <!-- Esterno e Clavícula -->
    <path d="M 230 40 L 370 40" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
    <text x="375" y="44" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Clavícula</text>
    
    <rect x="290" y="40" width="20" height="180" rx="6" fill="#334155" stroke="#475569" stroke-width="2"/>
    <text x="300" y="130" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10" transform="rotate(90,300,130)" text-anchor="middle">Esterno</text>

    <!-- Braço Esquerdo (Úmero) -->
    <line x1="160" y1="70" x2="180" y2="240" stroke="#1e293b" stroke-width="18" stroke-linecap="round"/>
    <text x="135" y="160" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Úmero</text>

    <!-- Porção Clavicular (Fibras Superiores Descendentes) -->
    <path d="M 230 46 L 290 46 L 180 85 Z" fill="#f43f5e" opacity="0.85"/>
    <text x="215" y="32" fill="#fda4af" font-family="'Inter', sans-serif" font-size="10" font-weight="700">Porção Clavicular</text>

    <!-- Porção Esternocostal (Fibras Horizontais e Ascendentes em Leque) -->
    <path d="M 290 50 L 300 200 C 260 180 200 120 180 90 Z" fill="url(#muscleGrad)" stroke="#f43f5e" stroke-width="2"/>
    <text x="260" y="225" fill="#fecdd3" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Porção Esternocostal</text>

    <!-- Tendão Torcido em "U" na Inserção -->
    <line x1="180" y1="85" x2="175" y2="105" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round"/>

    <!-- Ponto O (Clavícula + Esterno) -->
    <circle cx="290" cy="50" r="7" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="295" cy="120" r="7" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <text x="290" y="53.5" fill="#fff" font-family="'Inter', sans-serif" font-size="9" font-weight="900" text-anchor="middle">O</text>
    <text x="295" y="123.5" fill="#fff" font-family="'Inter', sans-serif" font-size="9" font-weight="900" text-anchor="middle">O</text>

    <!-- Ponto I (Crista do Tubérculo Maior) -->
    <circle cx="178" cy="95" r="8" fill="#b45309" stroke="#facc15" stroke-width="2.5"/>
    <text x="178" y="99" fill="#fff" font-family="'Inter', sans-serif" font-size="10" font-weight="900" text-anchor="middle">I</text>

    <!-- Destaque Anatômico do Tubérculo Maior -->
    <rect x="420" y="70" width="220" height="90" rx="8" fill="#0f172a" stroke="rgba(250, 204, 21, 0.4)" stroke-width="1.5"/>
    <text x="530" y="90" fill="#facc15" font-family="'Inter', sans-serif" font-size="11" font-weight="800" text-anchor="middle">LOCAL DA INSERÇÃO</text>
    <text x="435" y="110" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="11"><tspan font-weight="700">Crista do Tubérculo Maior</tspan></text>
    <text x="435" y="126" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">(lábio lateral do sulco bicipital)</text>
    <text x="435" y="144" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10">Tendão com torção característica</text>
  
  </g>

  <!-- Rodapé com Síntese Cinesiológica -->
  <g transform="translate(24, 385)">
    <rect x="0" y="0" width="652" height="58" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    
    <!-- Origem -->
    <circle cx="20" cy="20" r="7" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <text x="20" y="23.5" fill="#fff" font-family="'Inter', sans-serif" font-size="9" font-weight="900" text-anchor="middle">O</text>
    <text x="34" y="23" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Origem: <tspan fill="#f1f5f9" font-weight="700">Metade medial da Clavícula + Face anterior do Esterno e Cartilagens 1ª–6ª</tspan></text>

    <!-- Inserção -->
    <circle cx="20" cy="41" r="7" fill="#b45309" stroke="#facc15" stroke-width="2"/>
    <text x="20" y="44.5" fill="#fff" font-family="'Inter', sans-serif" font-size="9" font-weight="900" text-anchor="middle">I</text>
    <text x="34" y="44" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Inserção: <tspan fill="#f1f5f9" font-weight="700">Crista do Tubérculo Maior do Úmero (lábio lateral do sulco)</tspan></text>

    <!-- Ação -->
    <line x1="390" y1="10" x2="390" y2="50" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="406" y="24" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10" font-weight="800" letter-spacing="0.5">AÇÃO PRINCIPAL</text>
    <text x="406" y="43" fill="#facc15" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Adução Horizontal, Adução e Rotação Medial do Ombro</text>
  </g>
</svg>