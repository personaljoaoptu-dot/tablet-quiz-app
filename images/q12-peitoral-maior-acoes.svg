<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="muscleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="40%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fundo com Borda Elegante -->
  <rect width="700" height="460" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="698" height="458" rx="15" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Grid sutil de fundo para estética técnica -->
  <g stroke="rgba(255,255,255,0.025)" stroke-width="1">
    <line x1="0" y1="90" x2="700" y2="90"/>
    <line x1="0" y1="180" x2="700" y2="180"/>
    <line x1="0" y1="270" x2="700" y2="270"/>
    <line x1="0" y1="360" x2="700" y2="360"/>
    <line x1="175" y1="0" x2="175" y2="380"/>
    <line x1="350" y1="0" x2="350" y2="380"/>
    <line x1="525" y1="0" x2="525" y2="380"/>
  </g>

  <!-- Cabeçalho do Card -->
  <g transform="translate(24, 20)">
    <!-- Badge da Categoria -->
    <rect x="0" y="0" width="103.5" height="24" rx="12" fill="rgba(202, 138, 4, 0.2)" stroke="rgba(234, 179, 8, 0.4)" stroke-width="1"/>
    <text x="51.75" y="16" fill="#facc15" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="1" text-anchor="middle">6. PEITORAL</text>
    
    <!-- Título Principal -->
    <text x="0" y="44" fill="#f8fafc" font-family="'Inter', system-ui, sans-serif" font-size="19" font-weight="800" letter-spacing="-0.3">Ações Cinesiológicas do Músculo Peitoral Maior</text>
    <text x="0" y="62" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="500">Ações conjuntas e específicas por porção funcional</text>
  </g>

  <!-- Conteúdo Ilustrativo Central -->
  <g transform="translate(0, 75)">
    
    <!-- Tórax e Braço em Adução Horizontal -->
    <circle cx="300" cy="140" r="50" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="300" y="145" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="12" font-weight="800" text-anchor="middle">Complexo do Ombro</text>

    <!-- 1. Adução Horizontal (Crucifixo / Supino / Voador) -->
    <g transform="translate(130, 60)">
      <circle cx="30" cy="30" r="28" fill="#0f172a" stroke="#facc15" stroke-width="1.5"/>
      <path d="M 45 30 L 15 30" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
      <polygon points="22,26 15,30 22,34" fill="#facc15"/>
      <text x="30" y="75" fill="#facc15" font-family="'Inter', sans-serif" font-size="11" font-weight="800" text-anchor="middle">ADUÇÃO HORIZ.</text>
      <text x="30" y="90" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Crucifixo / Voador</text>
    </g>

    <!-- 2. Porção Clavicular: Flexão até 90° -->
    <g transform="translate(250, 220)">
      <circle cx="30" cy="30" r="28" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <path d="M 30 45 L 30 15" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
      <polygon points="26,22 30,15 34,22" fill="#38bdf8"/>
      <text x="30" y="75" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="11" font-weight="800" text-anchor="middle">P. CLAVICULAR</text>
      <text x="30" y="90" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Flexão do Ombro</text>
    </g>

    <!-- 3. Porção Esternocostal: Extensão a partir da flexão -->
    <g transform="translate(410, 60)">
      <circle cx="30" cy="30" r="28" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5"/>
      <path d="M 30 15 L 30 45" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
      <polygon points="26,38 30,45 34,38" fill="#f43f5e"/>
      <text x="30" y="75" fill="#f43f5e" font-family="'Inter', sans-serif" font-size="11" font-weight="800" text-anchor="middle">P. ESTERNOCOSTAL</text>
      <text x="30" y="90" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Extensão até posição neutra</text>
    </g>

    <!-- Rotação Medial e Adução Geral -->
    <rect x="420" y="210" width="220" height="85" rx="8" fill="#0f172a" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="530" y="230" fill="#facc15" font-family="'Inter', sans-serif" font-size="11" font-weight="800" text-anchor="middle">AÇÕES CONJUNTAS</text>
    <text x="435" y="250" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="11">• <tspan font-weight="700">Adução pura do ombro</tspan></text>
    <text x="435" y="267" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="11">• <tspan font-weight="700">Rotação medial do úmero</tspan></text>
    <text x="435" y="283" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Potente nos movimentos de abraço</text>
  
  </g>

  <!-- Rodapé com Síntese Cinesiológica -->
  <g transform="translate(24, 385)">
    <rect x="0" y="0" width="652" height="58" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    
    <!-- Origem -->
    <circle cx="20" cy="20" r="7" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <text x="20" y="23.5" fill="#fff" font-family="'Inter', sans-serif" font-size="9" font-weight="900" text-anchor="middle">O</text>
    <text x="34" y="23" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Origem: <tspan fill="#f1f5f9" font-weight="700">Clavícula (medial), Esterno e Costelas 1ª–6ª</tspan></text>

    <!-- Inserção -->
    <circle cx="20" cy="41" r="7" fill="#b45309" stroke="#facc15" stroke-width="2"/>
    <text x="20" y="44.5" fill="#fff" font-family="'Inter', sans-serif" font-size="9" font-weight="900" text-anchor="middle">I</text>
    <text x="34" y="44" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Inserção: <tspan fill="#f1f5f9" font-weight="700">Crista do Tubérculo Maior do Úmero</tspan></text>

    <!-- Ação -->
    <line x1="390" y1="10" x2="390" y2="50" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="406" y="24" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10" font-weight="800" letter-spacing="0.5">AÇÃO PRINCIPAL</text>
    <text x="406" y="43" fill="#facc15" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Adução Horizontal, Adução e Rotação Medial</text>
  </g>
</svg>