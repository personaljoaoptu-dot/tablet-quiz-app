<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bg3)"/>
  
  <!-- Eixos do gráfico -->
  <line x1="80" y1="310" x2="520" y2="310" stroke="#475569" stroke-width="2"/>
  <line x1="80" y1="90" x2="80" y2="310" stroke="#475569" stroke-width="2"/>
  
  <!-- Linha de grade -->
  <line x1="80" y1="200" x2="520" y2="200" stroke="#334155" stroke-dasharray="4,4"/>
  
  <!-- Onda periódica -->
  <path d="M 80 200 Q 135 110 190 200 T 300 200 T 410 200 T 520 200" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
  
  <text x="300" y="55" fill="#34d399" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Curva de Resposta Temporal</text>
  <text x="300" y="350" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">Oscilação constante no intervalo de tempo t</text>
</svg>
