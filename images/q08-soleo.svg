<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="muscleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="40%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fundo com Borda Elegante -->
  <rect width="700" height="460" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="698" height="458" rx="15" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Grid sutil de fundo para estética técnica -->
  <g stroke="rgba(255,255,255,0.025)" stroke-width="1">
    <line x1="0" y1="90" x2="700" y2="90"/>
    <line x1="0" y1="180" x2="700" y2="180"/>
    <line x1="0" y1="270" x2="700" y2="270"/>
    <line x1="0" y1="360" x2="700" y2="360"/>
    <line x1="175" y1="0" x2="175" y2="380"/>
    <line x1="350" y1="0" x2="350" y2="380"/>
    <line x1="525" y1="0" x2="525" y2="380"/>
  </g>

  <!-- Cabeçalho do Card -->
  <g transform="translate(24, 20)">
    <!-- Badge da Categoria -->
    <rect x="0" y="0" width="265" height="24" rx="12" fill="rgba(202, 138, 4, 0.2)" stroke="rgba(234, 179, 8, 0.4)" stroke-width="1"/>
    <text x="132.5" y="16" fill="#facc15" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="1" text-anchor="middle">4. PANTURRILHA (TRÍCEPS SURAL)</text>
    
    <!-- Título Principal -->
    <text x="0" y="44" fill="#f8fafc" font-family="'Inter', system-ui, sans-serif" font-size="19" font-weight="800" letter-spacing="-0.3">Músculo Sóleo (Soleus)</text>
    <text x="0" y="62" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="500">Componente monoarticular profundo: eficiente na flexão plantar com joelho dobrado</text>
  </g>

  <!-- Conteúdo Ilustrativo Central -->
  <g transform="translate(0, 75)">
    
    <!-- Tíbia e Fíbula Posteriores -->
    <path d="M 280 40 L 315 40 L 305 230 L 280 230 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <line x1="325" y1="50" x2="320" y2="230" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Linha do Sóleo na Tíbia (Origem) -->
    <path d="M 285 65 L 325 55" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="305" cy="60" r="8" fill="#0284c7" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="305" y="64" fill="#fff" font-family="'Inter', sans-serif" font-size="10" font-weight="900" text-anchor="middle">O</text>
    <text x="210" y="65" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10" font-weight="700">Linha do Sóleo (Tíbia)</text>

    <!-- Músculo Sóleo (Largo e Achatado) -->
    <path d="M 280 70 C 260 110 260 180 290 220 L 315 220 C 335 180 335 110 325 70 Z" fill="url(#muscleGrad)" stroke="#f43f5e" stroke-width="2"/>
    <text x="300" y="145" fill="#fecdd3" font-family="'Inter', sans-serif" font-size="12" font-weight="800" text-anchor="middle">M. Sóleo</text>
    <text x="300" y="160" fill="#fecdd3" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">(Camada Profunda)</text>

    <!-- Tendão Calcâneo -->
    <rect x="294" y="220" width="16" height="60" fill="#e2e8f0"/>
    
    <!-- Calcâneo -->
    <ellipse cx="302" cy="290" rx="22" ry="14" fill="#334155" stroke="#475569" stroke-width="2"/>
    <circle cx="302" cy="285" r="8" fill="#b45309" stroke="#facc15" stroke-width="2.5"/>
    <text x="302" y="289" fill="#fff" font-family="'Inter', sans-serif" font-size="10" font-weight="900" text-anchor="middle">I</text>

    <!-- Destaque Cinesiológico Crucial -->
    <rect x="420" y="65" width="220" height="95" rx="8" fill="#0f172a" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1.5"/>
    <text x="530" y="85" fill="#34d399" font-family="'Inter', sans-serif" font-size="11" font-weight="800" text-anchor="middle">IMPORTÂNCIA NO TREINO</text>
    <text x="435" y="105" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="11">Como <tspan font-weight="700">NÃO cruza o joelho</tspan>,</text>
    <text x="435" y="121" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="11">é o motor primário na</text>
    <text x="435" y="139" fill="#facc15" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Panturrilha Sentada (joelho 90°)</text>
  
  </g>

  <!-- Rodapé com Síntese Cinesiológica -->
  <g transform="translate(24, 385)">
    <rect x="0" y="0" width="652" height="58" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    
    <!-- Origem -->
    <circle cx="20" cy="20" r="7" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <text x="20" y="23.5" fill="#fff" font-family="'Inter', sans-serif" font-size="9" font-weight="900" text-anchor="middle">O</text>
    <text x="34" y="23" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Origem: <tspan fill="#f1f5f9" font-weight="700">Face posterior da Tíbia (linha do sóleo) e cabeça da Fíbula</tspan></text>

    <!-- Inserção -->
    <circle cx="20" cy="41" r="7" fill="#b45309" stroke="#facc15" stroke-width="2"/>
    <text x="20" y="44.5" fill="#fff" font-family="'Inter', sans-serif" font-size="9" font-weight="900" text-anchor="middle">I</text>
    <text x="34" y="44" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Inserção: <tspan fill="#f1f5f9" font-weight="700">Face posterior do Calcâneo (através do Tendão Calcâneo)</tspan></text>

    <!-- Ação -->
    <line x1="390" y1="10" x2="390" y2="50" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="406" y="24" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10" font-weight="800" letter-spacing="0.5">AÇÃO PRINCIPAL</text>
    <text x="406" y="43" fill="#facc15" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Flexão Plantar Independente da Posição do Joelho</text>
  </g>
</svg>