<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="muscleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="40%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fundo com Borda Elegante -->
  <rect width="700" height="460" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="698" height="458" rx="15" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Grid sutil de fundo para estética técnica -->
  <g stroke="rgba(255,255,255,0.025)" stroke-width="1">
    <line x1="0" y1="90" x2="700" y2="90"/>
    <line x1="0" y1="180" x2="700" y2="180"/>
    <line x1="0" y1="270" x2="700" y2="270"/>
    <line x1="0" y1="360" x2="700" y2="360"/>
    <line x1="175" y1="0" x2="175" y2="380"/>
    <line x1="350" y1="0" x2="350" y2="380"/>
    <line x1="525" y1="0" x2="525" y2="380"/>
  </g>

  <!-- Cabeçalho do Card -->
  <g transform="translate(24, 20)">
    <!-- Badge da Categoria -->
    <rect x="0" y="0" width="95" height="24" rx="12" fill="rgba(202, 138, 4, 0.2)" stroke="rgba(234, 179, 8, 0.4)" stroke-width="1"/>
    <text x="47.5" y="16" fill="#facc15" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="1" text-anchor="middle">3. GLÚTEOS</text>
    
    <!-- Título Principal -->
    <text x="0" y="44" fill="#f8fafc" font-family="'Inter', system-ui, sans-serif" font-size="19" font-weight="800" letter-spacing="-0.3">Músculo Glúteo Máximo (Gluteus Maximus)</text>
    <text x="0" y="62" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="500">O músculo mais volumoso e potente extensor do quadril</text>
  </g>

  <!-- Conteúdo Ilustrativo Central -->
  <g transform="translate(0, 75)">
    
    <!-- Pelve / Sacro / Cóccix (Posterior) -->
    <path d="M 200 40 Q 280 20 360 40 Q 370 120 330 160 Q 290 190 270 180 Q 220 120 200 40 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <path d="M 285 45 L 295 125 L 285 145" fill="none" stroke="#475569" stroke-width="4"/>
    <text x="290" y="35" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Sacro / Cóccix</text>

    <!-- Fêmur e Trato Iliotibial -->
    <line x1="210" y1="180" x2="210" y2="320" stroke="#334155" stroke-width="18" stroke-linecap="round"/>
    <line x1="180" y1="150" x2="180" y2="330" stroke="#e2e8f0" stroke-width="5" stroke-dasharray="8,4"/>
    <text x="120" y="240" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">Trato Iliotibial</text>

    <!-- Ventre Muscular do Glúteo Máximo (Fibras oblíquas descendentes) -->
    <path d="M 270 45 C 340 50 365 110 330 160 C 270 210 220 200 205 180 C 230 130 240 70 270 45 Z" fill="url(#muscleGrad)" stroke="#f43f5e" stroke-width="2"/>
    
    <!-- Linhas de fibras musculares oblíquas em direção ao fêmur -->
    <g stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-linecap="round">
      <line x1="280" y1="70" x2="225" y2="170"/>
      <line x1="300" y1="85" x2="235" y2="180"/>
      <line x1="320" y1="105" x2="245" y2="190"/>
      <line x1="330" y1="130" x2="260" y2="195"/>
    </g>

    <!-- Ponto O (Ílio Posterior / Sacro) -->
    <circle cx="285" cy="55" r="8" fill="#0284c7" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="285" y="59" fill="#fff" font-family="'Inter', sans-serif" font-size="10" font-weight="900" text-anchor="middle">O</text>
    
    <!-- Ponto I (Tuberosidade Glútea / Trato Iliotibial) -->
    <circle cx="215" cy="195" r="8" fill="#b45309" stroke="#facc15" stroke-width="2.5"/>
    <text x="215" y="199" fill="#fff" font-family="'Inter', sans-serif" font-size="10" font-weight="900" text-anchor="middle">I</text>

    <!-- Caixa explicativa lateral -->
    <rect x="420" y="70" width="220" height="90" rx="8" fill="#0f172a" stroke="rgba(250, 204, 21, 0.3)" stroke-width="1"/>
    <text x="530" y="92" fill="#facc15" font-family="'Inter', sans-serif" font-size="11" font-weight="800" text-anchor="middle">INSERÇÃO DUPLA</text>
    <text x="435" y="112" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="11">• 3/4 no <tspan font-weight="700">Trato Iliotibial (TIT)</tspan></text>
    <text x="435" y="130" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="11">• 1/4 na <tspan font-weight="700">Tuberosidade Glútea</tspan></text>
    <text x="435" y="146" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">(crista lateral posterior do fêmur)</text>
  
  </g>

  <!-- Rodapé com Síntese Cinesiológica -->
  <g transform="translate(24, 385)">
    <rect x="0" y="0" width="652" height="58" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    
    <!-- Origem -->
    <circle cx="20" cy="20" r="7" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <text x="20" y="23.5" fill="#fff" font-family="'Inter', sans-serif" font-size="9" font-weight="900" text-anchor="middle">O</text>
    <text x="34" y="23" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Origem: <tspan fill="#f1f5f9" font-weight="700">Ílio posterior à linha glútea, Sacro, Cóccix e Lig. sacrotuberal</tspan></text>

    <!-- Inserção -->
    <circle cx="20" cy="41" r="7" fill="#b45309" stroke="#facc15" stroke-width="2"/>
    <text x="20" y="44.5" fill="#fff" font-family="'Inter', sans-serif" font-size="9" font-weight="900" text-anchor="middle">I</text>
    <text x="34" y="44" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Inserção: <tspan fill="#f1f5f9" font-weight="700">Trato Iliotibial e Tuberosidade Glútea do Fêmur</tspan></text>

    <!-- Ação -->
    <line x1="390" y1="10" x2="390" y2="50" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="406" y="24" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10" font-weight="800" letter-spacing="0.5">AÇÃO PRINCIPAL</text>
    <text x="406" y="43" fill="#facc15" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Extensão e Rotação Lateral Potente do Quadril</text>
  </g>
</svg>