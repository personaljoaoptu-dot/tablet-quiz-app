<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="muscleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="40%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fundo com Borda Elegante -->
  <rect width="700" height="460" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="698" height="458" rx="15" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Grid sutil de fundo para estética técnica -->
  <g stroke="rgba(255,255,255,0.025)" stroke-width="1">
    <line x1="0" y1="90" x2="700" y2="90"/>
    <line x1="0" y1="180" x2="700" y2="180"/>
    <line x1="0" y1="270" x2="700" y2="270"/>
    <line x1="0" y1="360" x2="700" y2="360"/>
    <line x1="175" y1="0" x2="175" y2="380"/>
    <line x1="350" y1="0" x2="350" y2="380"/>
    <line x1="525" y1="0" x2="525" y2="380"/>
  </g>

  <!-- Cabeçalho do Card -->
  <g transform="translate(24, 20)">
    <!-- Badge da Categoria -->
    <rect x="0" y="0" width="265" height="24" rx="12" fill="rgba(202, 138, 4, 0.2)" stroke="rgba(234, 179, 8, 0.4)" stroke-width="1"/>
    <text x="132.5" y="16" fill="#facc15" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="1" text-anchor="middle">4. PANTURRILHA (TRÍCEPS SURAL)</text>
    
    <!-- Título Principal -->
    <text x="0" y="44" fill="#f8fafc" font-family="'Inter', system-ui, sans-serif" font-size="19" font-weight="800" letter-spacing="-0.3">Músculo Gastrocnêmio (Gastrocnemius)</text>
    <text x="0" y="62" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="500">Componente biarticular superficial: cabeças medial e lateral originadas no fêmur</text>
  </g>

  <!-- Conteúdo Ilustrativo Central -->
  <g transform="translate(0, 75)">
    
    <!-- Fêmur Distal -->
    <path d="M 270 20 L 330 20 L 320 60 L 335 80 L 265 80 L 280 60 Z" fill="#334155" stroke="#475569" stroke-width="2"/>
    <text x="300" y="45" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Fêmur Distal</text>

    <!-- Origens nos Côndilos -->
    <circle cx="270" cy="80" r="7" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="330" cy="80" r="7" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <text x="210" y="84" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10" font-weight="700">Côndilo Medial</text>
    <text x="345" y="84" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10" font-weight="700">Côndilo Lateral</text>

    <!-- Ventres Gêmeos (Medial e Lateral) -->
    <path d="M 270 85 C 245 110 245 170 285 200 C 295 180 295 110 270 85 Z" fill="url(#muscleGrad)" stroke="#f43f5e" stroke-width="2"/>
    <path d="M 330 85 C 355 110 355 170 315 200 C 305 180 305 110 330 85 Z" fill="url(#muscleGrad)" stroke="#f43f5e" stroke-width="2"/>

    <!-- Tendão Calcâneo Robusto (Tendão de Aquiles) -->
    <path d="M 285 200 L 315 200 L 308 285 L 292 285 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="350" y="240" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Tendão Calcâneo</text>
    <text x="350" y="254" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9">(Aquiles)</text>

    <!-- Osso Calcâneo -->
    <ellipse cx="300" cy="295" rx="26" ry="16" fill="#334155" stroke="#475569" stroke-width="2"/>
    <text x="300" y="325" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Calcâneo (Calcanhar)</text>

    <!-- Inserção -->
    <circle cx="300" cy="290" r="8" fill="#b45309" stroke="#facc15" stroke-width="2.5"/>
    <text x="300" y="294" fill="#fff" font-family="'Inter', sans-serif" font-size="10" font-weight="900" text-anchor="middle">I</text>

    <!-- Ação: Biarticular -->
    <rect x="440" y="60" width="200" height="85" rx="8" fill="#0f172a" stroke="rgba(234, 179, 8, 0.3)" stroke-width="1.5"/>
    <text x="540" y="80" fill="#facc15" font-family="'Inter', sans-serif" font-size="11" font-weight="800" text-anchor="middle">MÚSCULO BIARTICULAR</text>
    <text x="450" y="100" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="11">Cruza o <tspan font-weight="700">joelho</tspan> e o <tspan font-weight="700">tornozelo</tspan>.</text>
    <text x="450" y="118" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Com joelho flexionado a 90°,</text>
    <text x="450" y="132" fill="#f87171" font-family="'Inter', sans-serif" font-size="10">perde eficiência mecânica.</text>
  
  </g>

  <!-- Rodapé com Síntese Cinesiológica -->
  <g transform="translate(24, 385)">
    <rect x="0" y="0" width="652" height="58" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    
    <!-- Origem -->
    <circle cx="20" cy="20" r="7" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <text x="20" y="23.5" fill="#fff" font-family="'Inter', sans-serif" font-size="9" font-weight="900" text-anchor="middle">O</text>
    <text x="34" y="23" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Origem: <tspan fill="#f1f5f9" font-weight="700">Côndilos Medial e Lateral do Fêmur (face posterior)</tspan></text>

    <!-- Inserção -->
    <circle cx="20" cy="41" r="7" fill="#b45309" stroke="#facc15" stroke-width="2"/>
    <text x="20" y="44.5" fill="#fff" font-family="'Inter', sans-serif" font-size="9" font-weight="900" text-anchor="middle">I</text>
    <text x="34" y="44" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Inserção: <tspan fill="#f1f5f9" font-weight="700">Face posterior do Calcâneo (via Tendão de Aquiles)</tspan></text>

    <!-- Ação -->
    <line x1="390" y1="10" x2="390" y2="50" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="406" y="24" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10" font-weight="800" letter-spacing="0.5">AÇÃO PRINCIPAL</text>
    <text x="406" y="43" fill="#facc15" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Flexão Plantar do Tornozelo e Auxilia Flexão do Joelho</text>
  </g>
</svg>