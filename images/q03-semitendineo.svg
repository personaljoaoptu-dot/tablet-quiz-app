<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="muscleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="40%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fundo com Borda Elegante -->
  <rect width="700" height="460" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="698" height="458" rx="15" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Grid sutil de fundo para estética técnica -->
  <g stroke="rgba(255,255,255,0.025)" stroke-width="1">
    <line x1="0" y1="90" x2="700" y2="90"/>
    <line x1="0" y1="180" x2="700" y2="180"/>
    <line x1="0" y1="270" x2="700" y2="270"/>
    <line x1="0" y1="360" x2="700" y2="360"/>
    <line x1="175" y1="0" x2="175" y2="380"/>
    <line x1="350" y1="0" x2="350" y2="380"/>
    <line x1="525" y1="0" x2="525" y2="380"/>
  </g>

  <!-- Cabeçalho do Card -->
  <g transform="translate(24, 20)">
    <!-- Badge da Categoria -->
    <rect x="0" y="0" width="146" height="24" rx="12" fill="rgba(202, 138, 4, 0.2)" stroke="rgba(234, 179, 8, 0.4)" stroke-width="1"/>
    <text x="73" y="16" fill="#facc15" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="1" text-anchor="middle">2. ISQUIOTIBIAIS</text>
    
    <!-- Título Principal -->
    <text x="0" y="44" fill="#f8fafc" font-family="'Inter', system-ui, sans-serif" font-size="19" font-weight="800" letter-spacing="-0.3">Músculo Semitendíneo (Semitendinosus)</text>
    <text x="0" y="62" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="500">Componente medial dos isquiotibiais que compõe a Pata de Ganso</text>
  </g>

  <!-- Conteúdo Ilustrativo Central -->
  <g transform="translate(0, 75)">
    
    <!-- Pelve Vista Posterior -->
    <path d="M 240 30 Q 300 20 350 40 L 330 75 Q 290 85 250 65 Z" fill="#334155" stroke="#475569" stroke-width="1.5"/>

    <!-- Túber Isquiático (Origem) -->
    <circle cx="270" cy="65" r="8" fill="#0284c7" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="270" y="69" fill="#fff" font-family="'Inter', sans-serif" font-size="10" font-weight="900" text-anchor="middle">O</text>
    
    <path d="M 262 65 L 150 65" stroke="#38bdf8" stroke-dasharray="3,3" stroke-width="1.5"/>
    <rect x="40" y="50" width="105" height="30" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="92" y="63" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="9" font-weight="800" text-anchor="middle">ORIGEM</text>
    <text x="92" y="75" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Túber Isquiático</text>

    <!-- Fêmur Posterior (Sombra) -->
    <line x1="295" y1="70" x2="295" y2="250" stroke="#1e293b" stroke-width="26" stroke-linecap="round"/>

    <!-- Músculo Semitendíneo -->
    <!-- Ventre carnoso na metade superior -->
    <path d="M 270 70 C 255 100 250 160 270 190 C 285 160 285 100 270 70 Z" fill="url(#muscleGrad)" stroke="#f43f5e" stroke-width="2"/>
    <text x="210" y="135" fill="#fecdd3" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Ventre Muscular</text>

    <!-- Longo Tendão em Corda (Metade Inferior) -->
    <path d="M 270 190 Q 268 230 258 260 Q 250 280 262 290" fill="none" stroke="#e2e8f0" stroke-width="4.5" stroke-linecap="round"/>
    <text x="180" y="235" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Longo Tendão (Cordal)</text>

    <!-- Tíbia e Joelho Medial -->
    <path d="M 250 270 L 310 270 L 300 325 L 265 325 Z" fill="#334155" stroke="#475569" stroke-width="2"/>

    <!-- Inserção: Pata de Ganso -->
    <circle cx="262" cy="290" r="8" fill="#b45309" stroke="#facc15" stroke-width="2.5"/>
    <text x="262" y="294" fill="#fff" font-family="'Inter', sans-serif" font-size="10" font-weight="900" text-anchor="middle">I</text>

    <path d="M 270 290 L 380 290" stroke="#facc15" stroke-dasharray="3,3" stroke-width="1.5"/>
    <rect x="385" y="272" width="180" height="36" rx="6" fill="#0f172a" stroke="#facc15" stroke-width="1"/>
    <text x="475" y="286" fill="#facc15" font-family="'Inter', sans-serif" font-size="9" font-weight="800" text-anchor="middle">INSERÇÃO (PATA DE GANSO)</text>
    <text x="475" y="300" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Face Medial Superior da Tíbia</text>

    <!-- Box explicativo Pata de Ganso -->
    <rect x="420" y="90" width="180" height="70" rx="8" fill="#0f172a" stroke="rgba(250, 204, 21, 0.3)" stroke-width="1"/>
    <text x="510" y="110" fill="#facc15" font-family="'Inter', sans-serif" font-size="10" font-weight="800" text-anchor="middle">PATA DE GANSO (PES ANSERINUS)</text>
    <text x="510" y="127" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">• Sartório</text>
    <text x="510" y="141" fill="#fde047" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">• Semitendíneo</text>
    <text x="510" y="155" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">• Grácil</text>
  
  </g>

  <!-- Rodapé com Síntese Cinesiológica -->
  <g transform="translate(24, 385)">
    <rect x="0" y="0" width="652" height="58" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    
    <!-- Origem -->
    <circle cx="20" cy="20" r="7" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <text x="20" y="23.5" fill="#fff" font-family="'Inter', sans-serif" font-size="9" font-weight="900" text-anchor="middle">O</text>
    <text x="34" y="23" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Origem: <tspan fill="#f1f5f9" font-weight="700">Túber Isquiático da Pelve (compartilhado com bíceps femoral)</tspan></text>

    <!-- Inserção -->
    <circle cx="20" cy="41" r="7" fill="#b45309" stroke="#facc15" stroke-width="2"/>
    <text x="20" y="44.5" fill="#fff" font-family="'Inter', sans-serif" font-size="9" font-weight="900" text-anchor="middle">I</text>
    <text x="34" y="44" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Inserção: <tspan fill="#f1f5f9" font-weight="700">Face Medial da parte superior da Tíbia (Pata de Ganso)</tspan></text>

    <!-- Ação -->
    <line x1="390" y1="10" x2="390" y2="50" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="406" y="24" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10" font-weight="800" letter-spacing="0.5">AÇÃO PRINCIPAL</text>
    <text x="406" y="43" fill="#facc15" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Flexão do Joelho e Extensão do Quadril</text>
  </g>
</svg>