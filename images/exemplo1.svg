<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="heartGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#991b1b" stop-opacity="0.2"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bg1)"/>
  <circle cx="300" cy="200" r="110" fill="url(#heartGlow)"/>
  
  <!-- Linhas de circuito / vasculares -->
  <path d="M 120 200 Q 200 120 300 200 T 480 200" fill="none" stroke="#f87171" stroke-width="6" stroke-linecap="round"/>
  <path d="M 160 250 Q 240 290 300 200 T 440 150" fill="none" stroke="#60a5fa" stroke-width="5" stroke-linecap="round"/>
  <circle cx="300" cy="200" r="35" fill="#ef4444" stroke="#fff" stroke-width="4"/>
  
  <text x="300" y="340" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Esquema Demonstrativo A</text>
  <text x="300" y="365" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">Exemplo visual com 2 imagens</text>
</svg>
