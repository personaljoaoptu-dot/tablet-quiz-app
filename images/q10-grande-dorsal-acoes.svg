<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="muscleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="40%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fundo com Borda Elegante -->
  <rect width="700" height="460" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="698" height="458" rx="15" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Grid sutil de fundo para estética técnica -->
  <g stroke="rgba(255,255,255,0.025)" stroke-width="1">
    <line x1="0" y1="90" x2="700" y2="90"/>
    <line x1="0" y1="180" x2="700" y2="180"/>
    <line x1="0" y1="270" x2="700" y2="270"/>
    <line x1="0" y1="360" x2="700" y2="360"/>
    <line x1="175" y1="0" x2="175" y2="380"/>
    <line x1="350" y1="0" x2="350" y2="380"/>
    <line x1="525" y1="0" x2="525" y2="380"/>
  </g>

  <!-- Cabeçalho do Card -->
  <g transform="translate(24, 20)">
    <!-- Badge da Categoria -->
    <rect x="0" y="0" width="324.5" height="24" rx="12" fill="rgba(202, 138, 4, 0.2)" stroke="rgba(234, 179, 8, 0.4)" stroke-width="1"/>
    <text x="162.25" y="16" fill="#facc15" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="1" text-anchor="middle">5. GRANDE DORSAL (LATÍSSIMO DO DORSO)</text>
    
    <!-- Título Principal -->
    <text x="0" y="44" fill="#f8fafc" font-family="'Inter', system-ui, sans-serif" font-size="19" font-weight="800" letter-spacing="-0.3">Ações Cinesiológicas na Articulação do Ombro</text>
    <text x="0" y="62" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="500">Tríade funcional do grande dorsal na articulação glenoumeral</text>
  </g>

  <!-- Conteúdo Ilustrativo Central -->
  <g transform="translate(0, 75)">
    
    <!-- Articulação do Ombro Esquemática -->
    <circle cx="280" cy="140" r="50" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="280" y="145" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="12" font-weight="800" text-anchor="middle">Glenoumeral</text>

    <!-- 1. Vetor Adução (Puxada Frontal / Barra Fixa) -->
    <g transform="translate(140, 60)">
      <circle cx="30" cy="30" r="28" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <path d="M 45 15 L 15 45" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
      <polygon points="12,38 15,45 22,42" fill="#38bdf8"/>
      <text x="30" y="75" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="12" font-weight="800" text-anchor="middle">1. ADUÇÃO</text>
      <text x="30" y="90" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Plano Frontal</text>
    </g>

    <!-- 2. Vetor Extensão (Remada / Puxador Baixo) -->
    <g transform="translate(250, 220)">
      <circle cx="30" cy="30" r="28" fill="#0f172a" stroke="#facc15" stroke-width="1.5"/>
      <path d="M 30 10 L 30 50" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
      <polygon points="26,42 30,50 34,42" fill="#facc15"/>
      <text x="30" y="75" fill="#facc15" font-family="'Inter', sans-serif" font-size="12" font-weight="800" text-anchor="middle">2. EXTENSÃO</text>
      <text x="30" y="90" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Plano Sagital</text>
    </g>

    <!-- 3. Vetor Rotação Medial -->
    <g transform="translate(390, 60)">
      <circle cx="30" cy="30" r="28" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5"/>
      <path d="M 45 30 A 15 15 0 1 1 20 18" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
      <polygon points="15,22 20,15 25,23" fill="#f43f5e"/>
      <text x="30" y="75" fill="#f43f5e" font-family="'Inter', sans-serif" font-size="12" font-weight="800" text-anchor="middle">3. ROTAÇÃO MEDIAL</text>
      <text x="30" y="90" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Plano Transversal</text>
    </g>

    <!-- Painel Resumo -->
    <rect x="120" y="225" width="110" height="70" rx="8" fill="#0f172a" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="175" y="248" fill="#facc15" font-family="'Inter', sans-serif" font-size="10" font-weight="800" text-anchor="middle">EXERCÍCIO TÍPICO</text>
    <text x="175" y="265" fill="#fff" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Puxadas &amp; Remadas</text>
    <text x="175" y="280" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Barra Fixa / Pulldown</text>
  
  </g>

  <!-- Rodapé com Síntese Cinesiológica -->
  <g transform="translate(24, 385)">
    <rect x="0" y="0" width="652" height="58" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    
    <!-- Origem -->
    <circle cx="20" cy="20" r="7" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <text x="20" y="23.5" fill="#fff" font-family="'Inter', sans-serif" font-size="9" font-weight="900" text-anchor="middle">O</text>
    <text x="34" y="23" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Origem: <tspan fill="#f1f5f9" font-weight="700">T7–L5, Fáscia Toracolombar e Crista Ilíaca</tspan></text>

    <!-- Inserção -->
    <circle cx="20" cy="41" r="7" fill="#b45309" stroke="#facc15" stroke-width="2"/>
    <text x="20" y="44.5" fill="#fff" font-family="'Inter', sans-serif" font-size="9" font-weight="900" text-anchor="middle">I</text>
    <text x="34" y="44" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Inserção: <tspan fill="#f1f5f9" font-weight="700">Sulco Intertubercular do Úmero (passagem anterior)</tspan></text>

    <!-- Ação -->
    <line x1="390" y1="10" x2="390" y2="50" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="406" y="24" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10" font-weight="800" letter-spacing="0.5">AÇÃO PRINCIPAL</text>
    <text x="406" y="43" fill="#facc15" font-family="'Inter', sans-serif" font-size="12" font-weight="700">1. Extensão  |  2. Adução  |  3. Rotação Medial</text>
  </g>
</svg>