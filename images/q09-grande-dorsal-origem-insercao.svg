<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="muscleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="40%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fundo com Borda Elegante -->
  <rect width="700" height="460" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="698" height="458" rx="15" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Grid sutil de fundo para estética técnica -->
  <g stroke="rgba(255,255,255,0.025)" stroke-width="1">
    <line x1="0" y1="90" x2="700" y2="90"/>
    <line x1="0" y1="180" x2="700" y2="180"/>
    <line x1="0" y1="270" x2="700" y2="270"/>
    <line x1="0" y1="360" x2="700" y2="360"/>
    <line x1="175" y1="0" x2="175" y2="380"/>
    <line x1="350" y1="0" x2="350" y2="380"/>
    <line x1="525" y1="0" x2="525" y2="380"/>
  </g>

  <!-- Cabeçalho do Card -->
  <g transform="translate(24, 20)">
    <!-- Badge da Categoria -->
    <rect x="0" y="0" width="324.5" height="24" rx="12" fill="rgba(202, 138, 4, 0.2)" stroke="rgba(234, 179, 8, 0.4)" stroke-width="1"/>
    <text x="162.25" y="16" fill="#facc15" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="1" text-anchor="middle">5. GRANDE DORSAL (LATÍSSIMO DO DORSO)</text>
    
    <!-- Título Principal -->
    <text x="0" y="44" fill="#f8fafc" font-family="'Inter', system-ui, sans-serif" font-size="19" font-weight="800" letter-spacing="-0.3">Grande Dorsal: Origem Ampla e Inserção Umeral</text>
    <text x="0" y="62" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="500">O músculo de maior área do corpo humano, cobrindo todo o dorso inferior</text>
  </g>

  <!-- Conteúdo Ilustrativo Central -->
  <g transform="translate(0, 75)">
    
    <!-- Coluna Vertebral e Pelve (Posterior) -->
    <line x1="300" y1="20" x2="300" y2="280" stroke="#475569" stroke-width="6"/>
    <path d="M 230 260 Q 300 240 370 260 L 350 300 Q 300 290 250 300 Z" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <text x="300" y="320" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Crista Ilíaca / Pelve</text>

    <!-- Braço Esquerdo (Úmero) -->
    <line x1="160" y1="60" x2="180" y2="180" stroke="#334155" stroke-width="16" stroke-linecap="round"/>
    <text x="130" y="80" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Úmero</text>

    <!-- Ventre em Leque Triângular do Grande Dorsal -->
    <path d="M 300 70 L 300 260 C 260 260 230 250 210 210 Q 180 140 165 95 Q 220 80 300 70 Z" fill="url(#muscleGrad)" stroke="#f43f5e" stroke-width="2"/>

    <!-- Linhas de tração convergentes para o úmero -->
    <g stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-linecap="round">
      <line x1="295" y1="80" x2="175" y2="95"/>
      <line x1="295" y1="130" x2="175" y2="98"/>
      <line x1="295" y1="190" x2="178" y2="102"/>
      <line x1="285" y1="240" x2="185" y2="110"/>
    </g>

    <!-- Origem (Coluna T7-L5 e Crista Ilíaca) -->
    <circle cx="295" cy="160" r="8" fill="#0284c7" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="295" y="164" fill="#fff" font-family="'Inter', sans-serif" font-size="10" font-weight="900" text-anchor="middle">O</text>
    <text x="365" y="165" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="11" font-weight="700">T7-L5 e Fáscia</text>

    <!-- Inserção (Sulco Intertubercular) -->
    <circle cx="168" cy="95" r="8" fill="#b45309" stroke="#facc15" stroke-width="2.5"/>
    <text x="168" y="99" fill="#fff" font-family="'Inter', sans-serif" font-size="10" font-weight="900" text-anchor="middle">I</text>

    <!-- Box explicativo da Inserção -->
    <rect x="420" y="60" width="220" height="90" rx="8" fill="#0f172a" stroke="rgba(250, 204, 21, 0.4)" stroke-width="1.5"/>
    <text x="530" y="80" fill="#facc15" font-family="'Inter', sans-serif" font-size="11" font-weight="800" text-anchor="middle">DETALHE ANATÔMICO</text>
    <text x="435" y="100" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="11">Inserção no <tspan font-weight="700">assoalho do sulco</tspan></text>
    <text x="435" y="116" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="11"><tspan font-weight="700">intertubercular</tspan> do úmero</text>
    <text x="435" y="134" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">(entre o peitoral maior e o redondo maior)</text>
  
  </g>

  <!-- Rodapé com Síntese Cinesiológica -->
  <g transform="translate(24, 385)">
    <rect x="0" y="0" width="652" height="58" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    
    <!-- Origem -->
    <circle cx="20" cy="20" r="7" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <text x="20" y="23.5" fill="#fff" font-family="'Inter', sans-serif" font-size="9" font-weight="900" text-anchor="middle">O</text>
    <text x="34" y="23" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Origem: <tspan fill="#f1f5f9" font-weight="700">Processos espinhosos T7–L5, Fáscia Toracolombar, Crista Ilíaca e Costelas 9–12</tspan></text>

    <!-- Inserção -->
    <circle cx="20" cy="41" r="7" fill="#b45309" stroke="#facc15" stroke-width="2"/>
    <text x="20" y="44.5" fill="#fff" font-family="'Inter', sans-serif" font-size="9" font-weight="900" text-anchor="middle">I</text>
    <text x="34" y="44" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Inserção: <tspan fill="#f1f5f9" font-weight="700">Assoalho do Sulco Intertubercular do Úmero</tspan></text>

    <!-- Ação -->
    <line x1="390" y1="10" x2="390" y2="50" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="406" y="24" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10" font-weight="800" letter-spacing="0.5">AÇÃO PRINCIPAL</text>
    <text x="406" y="43" fill="#facc15" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Extensão, Adução e Rotação Medial do Ombro</text>
  </g>
</svg>