<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="muscleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="40%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fundo com Borda Elegante -->
  <rect width="700" height="460" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="698" height="458" rx="15" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Grid sutil de fundo para estética técnica -->
  <g stroke="rgba(255,255,255,0.025)" stroke-width="1">
    <line x1="0" y1="90" x2="700" y2="90"/>
    <line x1="0" y1="180" x2="700" y2="180"/>
    <line x1="0" y1="270" x2="700" y2="270"/>
    <line x1="0" y1="360" x2="700" y2="360"/>
    <line x1="175" y1="0" x2="175" y2="380"/>
    <line x1="350" y1="0" x2="350" y2="380"/>
    <line x1="525" y1="0" x2="525" y2="380"/>
  </g>

  <!-- Cabeçalho do Card -->
  <g transform="translate(24, 20)">
    <!-- Badge da Categoria -->
    <rect x="0" y="0" width="188.5" height="24" rx="12" fill="rgba(202, 138, 4, 0.2)" stroke="rgba(234, 179, 8, 0.4)" stroke-width="1"/>
    <text x="94.25" y="16" fill="#facc15" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="1" text-anchor="middle">1. QUADRÍCEPS FEMORAL</text>
    
    <!-- Título Principal -->
    <text x="0" y="44" fill="#f8fafc" font-family="'Inter', system-ui, sans-serif" font-size="19" font-weight="800" letter-spacing="-0.3">Vasto Lateral, Vasto Medial e Vasto Intermédio</text>
    <text x="0" y="62" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="500">Músculos monoarticulares: originam-se no fêmur e realizam apenas extensão do joelho</text>
  </g>

  <!-- Conteúdo Ilustrativo Central -->
  <g transform="translate(0, 75)">
    
    <!-- Fêmur e Pelve de Fundo -->
    <path d="M 285 20 L 325 20 L 315 240 L 295 240 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    
    <!-- Vasto Intermédio (Profundo) -->
    <path d="M 293 60 C 285 110 285 180 293 230 L 317 230 C 325 180 325 110 317 60 Z" fill="#be123c" stroke="#e11d48" stroke-width="1.5" opacity="0.6"/>

    <!-- Vasto Lateral (Esquerda / Lateral) -->
    <path d="M 288 50 C 230 100 230 190 285 235 L 295 220 C 260 170 260 100 292 65 Z" fill="url(#muscleGrad)" stroke="#f43f5e" stroke-width="2"/>
    <text x="210" y="145" fill="#fecdd3" font-family="'Inter', sans-serif" font-size="11" font-weight="700">V. Lateral</text>

    <!-- Vasto Medial (Direita / Medial com formato em gota oblíquo) -->
    <path d="M 322 70 C 350 110 365 170 325 235 L 312 220 C 345 180 335 120 318 80 Z" fill="url(#muscleGrad)" stroke="#f43f5e" stroke-width="2"/>
    <text x="365" y="160" fill="#fecdd3" font-family="'Inter', sans-serif" font-size="11" font-weight="700">V. Medial</text>
    <text x="365" y="174" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9">(Fibras Oblíquas)</text>

    <!-- Tendão Comum do Quadríceps + Patela -->
    <polygon points="288,235 322,235 305,255" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="330" y="250" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Patela</text>
    
    <!-- Ligamento Patelar e Tíbia -->
    <rect x="298" y="255" width="14" height="25" fill="#e2e8f0"/>
    <path d="M 280 280 L 330 280 L 320 320 L 290 320 Z" fill="#334155" stroke="#475569" stroke-width="2"/>

    <!-- Destaque "Não cruzam o quadril" -->
    <rect x="420" y="60" width="180" height="70" rx="8" fill="#0f172a" stroke="rgba(239, 68, 68, 0.4)" stroke-width="1.5"/>
    <text x="510" y="80" fill="#f87171" font-family="'Inter', sans-serif" font-size="11" font-weight="800" text-anchor="middle">ATENÇÃO CINESIOLÓGICA</text>
    <text x="510" y="98" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Os 3 vastos NÃO cruzam</text>
    <text x="510" y="114" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">o quadril (monoarticulares)</text>

    <!-- Seta de Ação: Extensão -->
    <g transform="translate(480, 230)">
      <circle cx="20" cy="20" r="24" fill="rgba(250, 204, 21, 0.1)" stroke="#facc15" stroke-width="1.5"/>
      <path d="M 20 32 L 20 8" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
      <polygon points="16,14 20,6 24,14" fill="#facc15"/>
      <text x="20" y="55" fill="#facc15" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Extensão</text>
    </g>
  
  </g>

  <!-- Rodapé com Síntese Cinesiológica -->
  <g transform="translate(24, 385)">
    <rect x="0" y="0" width="652" height="58" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    
    <!-- Origem -->
    <circle cx="20" cy="20" r="7" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <text x="20" y="23.5" fill="#fff" font-family="'Inter', sans-serif" font-size="9" font-weight="900" text-anchor="middle">O</text>
    <text x="34" y="23" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Origem: <tspan fill="#f1f5f9" font-weight="700">Face anterior, lateral e medial da diáfise do Fêmur (Linha Áspera)</tspan></text>

    <!-- Inserção -->
    <circle cx="20" cy="41" r="7" fill="#b45309" stroke="#facc15" stroke-width="2"/>
    <text x="20" y="44.5" fill="#fff" font-family="'Inter', sans-serif" font-size="9" font-weight="900" text-anchor="middle">I</text>
    <text x="34" y="44" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Inserção: <tspan fill="#f1f5f9" font-weight="700">Tuberosidade da Tíbia (via Tendão Quadricipital e Patela)</tspan></text>

    <!-- Ação -->
    <line x1="390" y1="10" x2="390" y2="50" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="406" y="24" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10" font-weight="800" letter-spacing="0.5">AÇÃO PRINCIPAL</text>
    <text x="406" y="43" fill="#facc15" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Extensão Pura do Joelho (Monoarticulares)</text>
  </g>
</svg>