<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="muscleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="40%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fundo com Borda Elegante -->
  <rect width="700" height="460" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="698" height="458" rx="15" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Grid sutil de fundo para estética técnica -->
  <g stroke="rgba(255,255,255,0.025)" stroke-width="1">
    <line x1="0" y1="90" x2="700" y2="90"/>
    <line x1="0" y1="180" x2="700" y2="180"/>
    <line x1="0" y1="270" x2="700" y2="270"/>
    <line x1="0" y1="360" x2="700" y2="360"/>
    <line x1="175" y1="0" x2="175" y2="380"/>
    <line x1="350" y1="0" x2="350" y2="380"/>
    <line x1="525" y1="0" x2="525" y2="380"/>
  </g>

  <!-- Cabeçalho do Card -->
  <g transform="translate(24, 20)">
    <!-- Badge da Categoria -->
    <rect x="0" y="0" width="146" height="24" rx="12" fill="rgba(202, 138, 4, 0.2)" stroke="rgba(234, 179, 8, 0.4)" stroke-width="1"/>
    <text x="73" y="16" fill="#facc15" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="1" text-anchor="middle">2. ISQUIOTIBIAIS</text>
    
    <!-- Título Principal -->
    <text x="0" y="44" fill="#f8fafc" font-family="'Inter', system-ui, sans-serif" font-size="19" font-weight="800" letter-spacing="-0.3">Bíceps Femoral - Cabeça Longa (Biceps Femoris)</text>
    <text x="0" y="62" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="500">Músculo biarticular lateral da região posterior da coxa</text>
  </g>

  <!-- Conteúdo Ilustrativo Central -->
  <g transform="translate(0, 75)">
    
    <!-- Pelve / Isquio -->
    <ellipse cx="270" cy="40" rx="50" ry="20" fill="#334155"/>
    <circle cx="265" cy="45" r="8" fill="#0284c7" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="265" y="49" fill="#fff" font-family="'Inter', sans-serif" font-size="10" font-weight="900" text-anchor="middle">O</text>
    <text x="170" y="48" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Túber Isquiático</text>

    <!-- Fêmur e Cabeça Curta de Apoio -->
    <line x1="285" y1="50" x2="310" y2="240" stroke="#1e293b" stroke-width="20" stroke-linecap="round"/>

    <!-- Cabeça Curta (Origem na linha áspera - mais profunda/lateral) -->
    <path d="M 305 130 C 325 160 330 200 325 230 L 315 220 Z" fill="#9f1239" opacity="0.7"/>
    <text x="350" y="170" fill="#f43f5e" font-family="'Inter', sans-serif" font-size="10">Cab. Curta (Mono)</text>

    <!-- Cabeça Longa (Biarticular - Destaque) -->
    <path d="M 265 48 C 285 100 320 180 322 230 C 305 180 280 100 265 48 Z" fill="url(#muscleGrad)" stroke="#f43f5e" stroke-width="2"/>
    <text x="220" y="140" fill="#fecdd3" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Cab. Longa (Biarticular)</text>

    <!-- Tendão Comum para a Cabeça da Fíbula -->
    <line x1="322" y1="230" x2="335" y2="265" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>

    <!-- Fíbula e Tíbia (Joelho Lateral) -->
    <path d="M 280 260 L 325 260 L 315 315 L 285 315 Z" fill="#334155" stroke="#475569" stroke-width="2"/>
    <circle cx="335" cy="265" r="12" fill="#475569" stroke="#64748b" stroke-width="1.5"/>
    <text x="360" y="270" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Fíbula</text>

    <!-- Pino de Inserção na Fíbula -->
    <circle cx="335" cy="265" r="8" fill="#b45309" stroke="#facc15" stroke-width="2.5"/>
    <text x="335" y="269" fill="#fff" font-family="'Inter', sans-serif" font-size="10" font-weight="900" text-anchor="middle">I</text>

    <!-- Destaque das 3 Ações -->
    <rect x="420" y="55" width="220" height="95" rx="8" fill="#0f172a" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>
    <text x="530" y="75" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="11" font-weight="800" text-anchor="middle">AÇÕES DA CABEÇA LONGA</text>
    <text x="435" y="95" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="11">1. <tspan font-weight="700">Flexão do joelho</tspan></text>
    <text x="435" y="113" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="11">2. <tspan font-weight="700">Extensão do quadril</tspan></text>
    <text x="435" y="131" fill="#facc15" font-family="'Inter', sans-serif" font-size="11">3. <tspan font-weight="700">Rotação lateral da perna</tspan>*</text>
  
  </g>

  <!-- Rodapé com Síntese Cinesiológica -->
  <g transform="translate(24, 385)">
    <rect x="0" y="0" width="652" height="58" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    
    <!-- Origem -->
    <circle cx="20" cy="20" r="7" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <text x="20" y="23.5" fill="#fff" font-family="'Inter', sans-serif" font-size="9" font-weight="900" text-anchor="middle">O</text>
    <text x="34" y="23" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Origem: <tspan fill="#f1f5f9" font-weight="700">Túber Isquiático (Cabeça Longa); Linha Áspera (Cabeça Curta)</tspan></text>

    <!-- Inserção -->
    <circle cx="20" cy="41" r="7" fill="#b45309" stroke="#facc15" stroke-width="2"/>
    <text x="20" y="44.5" fill="#fff" font-family="'Inter', sans-serif" font-size="9" font-weight="900" text-anchor="middle">I</text>
    <text x="34" y="44" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Inserção: <tspan fill="#f1f5f9" font-weight="700">Cabeça da Fíbula (face lateral)</tspan></text>

    <!-- Ação -->
    <line x1="390" y1="10" x2="390" y2="50" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="406" y="24" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10" font-weight="800" letter-spacing="0.5">AÇÃO PRINCIPAL</text>
    <text x="406" y="43" fill="#facc15" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Flexão do Joelho, Extensão do Quadril e Rotação Lateral da Perna</text>
  </g>
</svg>