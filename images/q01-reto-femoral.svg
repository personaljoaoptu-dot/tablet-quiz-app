<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="muscleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="40%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fundo com Borda Elegante -->
  <rect width="700" height="460" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="698" height="458" rx="15" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Grid sutil de fundo para estética técnica -->
  <g stroke="rgba(255,255,255,0.025)" stroke-width="1">
    <line x1="0" y1="90" x2="700" y2="90"/>
    <line x1="0" y1="180" x2="700" y2="180"/>
    <line x1="0" y1="270" x2="700" y2="270"/>
    <line x1="0" y1="360" x2="700" y2="360"/>
    <line x1="175" y1="0" x2="175" y2="380"/>
    <line x1="350" y1="0" x2="350" y2="380"/>
    <line x1="525" y1="0" x2="525" y2="380"/>
  </g>

  <!-- Cabeçalho do Card -->
  <g transform="translate(24, 20)">
    <!-- Badge da Categoria -->
    <rect x="0" y="0" width="188.5" height="24" rx="12" fill="rgba(202, 138, 4, 0.2)" stroke="rgba(234, 179, 8, 0.4)" stroke-width="1"/>
    <text x="94.25" y="16" fill="#facc15" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="1" text-anchor="middle">1. QUADRÍCEPS FEMORAL</text>
    
    <!-- Título Principal -->
    <text x="0" y="44" fill="#f8fafc" font-family="'Inter', system-ui, sans-serif" font-size="19" font-weight="800" letter-spacing="-0.3">Músculo Reto Femoral (Rectus Femoris)</text>
    <text x="0" y="62" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="500">Único componente biarticular do quadríceps (cruza quadril e joelho)</text>
  </g>

  <!-- Conteúdo Ilustrativo Central -->
  <g transform="translate(0, 75)">
    
    <!-- Pelve Esquemática -->
    <path d="M 230 40 Q 280 20 330 45 Q 350 70 330 90 L 300 95 Q 260 85 240 70 Z" fill="#334155" stroke="#475569" stroke-width="2"/>
    <text x="250" y="32" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Ílio / Pelve</text>

    <!-- Fêmur -->
    <path d="M 290 90 L 305 240 L 290 260 L 305 270 L 315 260 L 310 90 Z" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>

    <!-- Reto Femoral (Destaque Principal) -->
    <!-- Tendão Proximal -->
    <line x1="278" y1="62" x2="288" y2="95" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Ventre Muscular Fusiforme -->
    <path d="M 288 95 C 265 130 260 190 290 240 C 325 190 320 130 294 95 Z" fill="url(#muscleGrad)" stroke="#f43f5e" stroke-width="2" filter="url(#glow)"/>
    <!-- Fibras bipenadas -->
    <path d="M 291 105 L 291 230 M 275 140 L 291 160 M 307 140 L 291 160 M 273 175 L 291 195 M 308 175 L 291 195" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Tendão Distal e Patela -->
    <polygon points="280,240 302,240 291,255" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="325" y="250" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">Patela</text>
    <line x1="291" y1="255" x2="291" y2="280" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>

    <!-- Tíbia -->
    <path d="M 270 278 L 315 278 L 305 320 L 285 320 Z" fill="#334155" stroke="#475569" stroke-width="1.5"/>

    <!-- Pino de Origem (EIAI) -->
    <circle cx="278" cy="62" r="8" fill="#0284c7" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="278" y="66" fill="#fff" font-family="'Inter', sans-serif" font-size="10" font-weight="900" text-anchor="middle">O</text>
    
    <path d="M 270 60 L 160 60" stroke="#38bdf8" stroke-dasharray="3,3" stroke-width="1.5"/>
    <rect x="50" y="45" width="105" height="30" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="102" y="58" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="9" font-weight="800" text-anchor="middle">ORIGEM</text>
    <text x="102" y="70" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">EIAI (Pelve)</text>

    <!-- Pino de Inserção (Tuberosidade da Tíbia) -->
    <circle cx="291" cy="280" r="8" fill="#b45309" stroke="#facc15" stroke-width="2.5"/>
    <text x="291" y="284" fill="#fff" font-family="'Inter', sans-serif" font-size="10" font-weight="900" text-anchor="middle">I</text>

    <path d="M 299 280 L 420 280" stroke="#facc15" stroke-dasharray="3,3" stroke-width="1.5"/>
    <rect x="425" y="265" width="145" height="32" rx="6" fill="#0f172a" stroke="#facc15" stroke-width="1"/>
    <text x="497" y="278" fill="#facc15" font-family="'Inter', sans-serif" font-size="9" font-weight="800" text-anchor="middle">INSERÇÃO</text>
    <text x="497" y="291" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Tuberosidade da Tíbia</text>

    <!-- Vetor de Tração -->
    <g transform="translate(370, 150)">
      <path d="M 0 40 L 0 0" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" stroke-linecap="round"/>
      <polygon points="-4,8 0,0 4,8" fill="#38bdf8"/>
      <text x="15" y="16" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Tração</text>
      <text x="15" y="30" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Extensão</text>
    </g>
  
  </g>

  <!-- Rodapé com Síntese Cinesiológica -->
  <g transform="translate(24, 385)">
    <rect x="0" y="0" width="652" height="58" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    
    <!-- Origem -->
    <circle cx="20" cy="20" r="7" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <text x="20" y="23.5" fill="#fff" font-family="'Inter', sans-serif" font-size="9" font-weight="900" text-anchor="middle">O</text>
    <text x="34" y="23" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Origem: <tspan fill="#f1f5f9" font-weight="700">Espinha Ilíaca Anteroinferior (EIAI) e sulco supra-acetabular</tspan></text>

    <!-- Inserção -->
    <circle cx="20" cy="41" r="7" fill="#b45309" stroke="#facc15" stroke-width="2"/>
    <text x="20" y="44.5" fill="#fff" font-family="'Inter', sans-serif" font-size="9" font-weight="900" text-anchor="middle">I</text>
    <text x="34" y="44" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Inserção: <tspan fill="#f1f5f9" font-weight="700">Tuberosidade da Tíbia (via Patela e Ligamento Patelar)</tspan></text>

    <!-- Ação -->
    <line x1="390" y1="10" x2="390" y2="50" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="406" y="24" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10" font-weight="800" letter-spacing="0.5">AÇÃO PRINCIPAL</text>
    <text x="406" y="43" fill="#facc15" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Flexão do Quadril e Extensão do Joelho</text>
  </g>
</svg>